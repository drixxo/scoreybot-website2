<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScoreyBot | Admin Dashboard</title>
    <style>
        :root {
            --bg-primary: #0f0f13;
            --bg-secondary: #181820;
            --bg-card: #21212b;
            --accent-purple: #9146FF;
            --accent-blurple: #5865F2;
            --text-main: #f5f5fa;
            --text-muted: #949ba4;
            --status-online: #23a55a;
            --status-error: #f23f43;
            --status-warning: #f0b232;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        header {
            background-color: var(--bg-secondary);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--bg-card);
        }

        .logo-area span { color: var(--accent-purple); }

        .status-badge {
            display: flex; align-items: center; background-color: var(--bg-card);
            padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
        }

        .status-dot {
            width: 8px; height: 8px; background-color: var(--status-online);
            border-radius: 50%; margin-right: 8px; box-shadow: 0 0 8px var(--status-online);
        }

        main { max-width: 1200px; margin: 40px auto; padding: 0 20px; }

        .metrics-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px;
        }

        .metric-card { background-color: var(--bg-secondary); border-radius: 12px; padding: 24px; }
        .metric-title { font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }
        .metric-value { font-size: 2rem; font-weight: 700; }
        .metric-card.blurple-accent { border-left: 4px solid var(--accent-blurple); }

        .dashboard-content { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        @media (max-width: 900px) { .dashboard-content { grid-template-columns: 1fr; } }

        .panel { background-color: var(--bg-secondary); border-radius: 14px; padding: 30px; margin-bottom: 30px; }
        .panel-title { font-size: 1.2rem; margin-bottom: 20px; font-weight: 600; border-bottom: 1px solid var(--bg-card); padding-bottom: 12px; }

        /* Form Controller Styles */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: var(--text-muted); }
        .form-input {
            width: 100%; padding: 10px; background-color: var(--bg-card); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px; color: white; font-size: 0.9rem;
        }
        .btn-container { display: flex; gap: 10px; margin-top: 15px; }
        .btn {
            flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; color: white;
        }
        .btn-add { background-color: var(--status-online); }
        .btn-remove { background-color: var(--status-error); }

        .streamer-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 16px; background-color: var(--bg-card); border-radius: 8px; margin-bottom: 12px;
        }
        .live-indicator { font-size: 0.75rem; background-color: rgba(255,255,255,0.05); color: var(--text-muted); padding: 4px 10px; border-radius: 6px; font-weight: 700; }

        .tech-status-list { display: flex; flex-direction: column; gap: 12px; }
        .tech-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .tech-value { font-family: monospace; font-weight: bold; background-color: var(--bg-card); padding: 2px 8px; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>Scorey<span>Bot</span> Control Panel</h1>
        </div>
        <div class="status-badge">
            <div class="status-dot"></div>
            SYSTEM OPERATIONAL
        </div>
    </header>

    <main>
        <section class="metrics-grid">
            <div class="metric-card blurple-accent">
                <div class="metric-title">AutoMod Integrity Protection</div>
                <div class="metric-value">Active Engine</div>
            </div>
        </section>

        <div class="dashboard-content">
            
            <div class="left-column">
                <section class="panel">
                    <h3 class="panel-title">Manage Stream Alerts</h3>
                    <div class="form-group">
                        <label>Twitch Username</label>
                        <input type="text" id="twitchName" class="form-input" placeholder="e.g. shroud">
                    </div>
                    <div class="form-group">
                        <label>Secret Dashboard Password</label>
                        <input type="password" id="secretPassword" class="form-input" placeholder="Enter WEB_SECRET key">
                    </div>
                    <div class="btn-container">
                        <button class="btn btn-add" onclick="manageStreamer('add')">Add Streamer</button>
                        <button class="btn btn-remove" onclick="manageStreamer('remove')">Remove Streamer</button>
                    </div>
                </section>

                <section class="panel">
                    <h3 class="panel-title">Tracked Streamer Registry</h3>
                    <div id="streamerListContainer">
                        <p style="color: var(--text-muted);">Loading active streams data from api...</p>
                    </div>
                </section>
            </div>

            <div class="right-column-stack">
                <section class="panel">
                    <h3 class="panel-title">System Diagnostics</h3>
                    <div class="tech-status-list">
                        <div class="tech-item"><span>API Mode</span><span class="tech-value">Live REST</span></div>
                        <div class="tech-item"><span>CORS Validation</span><span class="tech-value" style="color: var(--status-online);">Enabled</span></div>
                    </div>
                </section>
            </div>

        </div>
    </main>

    <script>
        // ⚠️ CHANGE THIS TO YOUR ACTUAL RAILWAY APP URL
        const BACKEND_URL = "https://railway.com/project/20a9c255-82d9-499a-8348-3a0cd53f29c4/service/5e932319-5427-45e1-958f-edfb405dcaa5/variables?environmentId=d6077e51-a7d3-4aa6-9ddb-25724f6b5e26";

        // Load and render streamers on startup
        async function fetchStreamers() {
            const container = document.getElementById('streamerListContainer');
            try {
                const response = await fetch(`${BACKEND_URL}/api/streamers`);
                const streamers = await response.json();
                
                const usernames = Object.keys(streamers);
                if (usernames.length === 0) {
                    container.innerHTML = `<p style="color: var(--text-muted);">No streamers currently registered inside database.</p>`;
                    return;
                }

                container.innerHTML = '';
                usernames.forEach(name => {
                    container.innerHTML += `
                        <div class="streamer-row">
                            <div>
                                <h4>${name}</h4>
                                <p style="font-size: 0.8rem; color: var(--text-muted);">Tracking actively monitored</p>
                            </div>
                            <div class="live-indicator">Registered</div>
                        </div>
                    `;
                });
            } catch (err) {
                container.innerHTML = `<p style="color: var(--status-error);">Error communicating with Railway backend server.</p>`;
            }
        }

        // Post updates to the bot
        async function manageStreamer(actionType) {
            const twitchName = document.getElementById('twitchName').value.trim();
            const secretPassword = document.getElementById('secretPassword').value;

            if (!twitchName || !secretPassword) {
                alert("Please provide both a streamer name and the dashboard secret password key.");
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/streamers/manage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: actionType, twitchName, secretPassword })
                });

                const result = await response.json();
                if (response.ok) {
                    alert(`Success: ${result.message}`);
                    document.getElementById('twitchName').value = '';
                    fetchStreamers(); // Refresh display
                } else {
                    alert(`Error: ${result.error}`);
                }
            } catch (err) {
                alert("Could not connect to your Railway bot server endpoint.");
            }
        }

        // Run fetch on initial window load
        fetchStreamers();
    </script>
</body>
</html>
